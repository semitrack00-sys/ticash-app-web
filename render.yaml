services:
  - type: web
    name: ticash-app-web
    runtime: static
    buildCommand: echo "Static TiCash site"
    staticPublishPath: .
    headers:
      - path: /.well-known/*
        name: Content-Type
        value: application/json
      - path: /apple-app-site-association
        name: Content-Type
        value: application/json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://ticash-api.onrender.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; child-src 'none'; worker-src 'none'; media-src 'none'; manifest-src 'self'; upgrade-insecure-requests"
      - path: /login
        name: Cache-Control
        value: "no-store, max-age=0"
      - path: /login/*
        name: Cache-Control
        value: "no-store, max-age=0"
      - path: /recharge
        name: Cache-Control
        value: "no-store, max-age=0"
      - path: /recharge/*
        name: Cache-Control
        value: "no-store, max-age=0"
