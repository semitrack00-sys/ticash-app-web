<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07182f">
  <meta name="description" content="Secure FlupFlap mobile recharge access by TiCash-App.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https: http://localhost:* http://127.0.0.1:* http://[::1]:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title data-i18n="loginPageTitle">Sign in | FlupFlap Recharge</title><meta name="robots" content="noindex">
  <link rel="stylesheet" href="/recharge/checkout.css">
  <link rel="icon" href="/brand/flupflap/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/language.css">
  <link rel="stylesheet" href="/login/login.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><img src="/ticash-logo.png" alt=""><span>TiCash-App</span></a>
    <nav aria-label="Main navigation" data-i18n-aria-label="navigation"><a href="/send" data-i18n="sendMoney">Send Money</a><a href="/recharge" data-i18n="mobileRecharge">Mobile Recharge</a><a href="/support" data-i18n="support">Support</a></nav>
  </header>
  <div class="login-layout">
    <section class="login-story" aria-label="FlupFlap">
      <a class="login-service" href="/" aria-label="FlupFlap">
        <img src="/brand/flupflap/ChatGPT Image Sep 24, 2026, 09_49_40 PM.png" alt="FlupFlap" width="2172" height="724">
      </a>
    </section>
  <main class="checkout-main" data-recharge-root data-login-brand="flupflap">
    <h1>Sign in to TiCash</h1>
    <p>Loading secure recharge checkout…</p>
    <noscript>Enable JavaScript to sign in and use secure recharge checkout.</noscript>
  </main>
  <div class="login-features" role="list" aria-label="Learn about FlupFlap">
    <button class="login-feature" type="button" role="listitem" data-feature-dialog="airtime">
      <span class="login-feature-icon login-feature-recharge" aria-hidden="true"></span>
      <span data-i18n="loginFeatureRecharge">Mobile Recharge</span>
      <span class="login-feature-arrow" aria-hidden="true">›</span>
    </button>
    <button class="login-feature" type="button" role="listitem" data-feature-dialog="bundles">
      <span class="login-feature-icon login-feature-worldwide" aria-hidden="true"></span>
      <span data-i18n="loginFeatureGlobal">Worldwide Coverage</span>
      <span class="login-feature-arrow" aria-hidden="true">›</span>
    </button>
    <button class="login-feature" type="button" role="listitem" data-feature-dialog="company">
      <span class="login-feature-icon login-feature-security" aria-hidden="true"></span>
      <span data-i18n="loginFeatureSafe">Safe &amp; Secure</span>
      <span class="login-feature-arrow" aria-hidden="true">›</span>
    </button>
  </div>

  <dialog class="feature-dialog" id="flupflap-feature-dialog" aria-labelledby="feature-dialog-title">
    <div class="feature-dialog-card">
      <button class="feature-dialog-close" type="button" aria-label="Close">×</button>
      <div class="feature-dialog-hero">
        <span class="feature-dialog-icon" aria-hidden="true"></span>
        <div>
          <p class="feature-dialog-eyebrow" id="feature-dialog-eyebrow"></p>
          <h2 id="feature-dialog-title"></h2>
        </div>
      </div>
      <p class="feature-dialog-intro" id="feature-dialog-intro"></p>
      <div class="feature-dialog-content" id="feature-dialog-content"></div>
      <div class="feature-dialog-actions">
        <a class="feature-dialog-primary" href="/">Start recharge</a>
        <button class="feature-dialog-secondary" type="button" data-dialog-close>Close</button>
      </div>
    </div>
  </dialog>
  </div>
  <footer class="site-footer"><span>© 2026 TiCash · contact@ticash-app.com</span><span><a href="/legal/privacy" data-i18n="privacy">Privacy</a><a href="/legal/terms" data-i18n="terms">Terms</a></span></footer>
  <script src="/public-config.js"></script>
  <script type="module" src="/js/recharge-page.js"></script>
  <script type="module" src="/login/feature-dialogs.js"></script>
</body>
</html>
